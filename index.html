<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Builder-a4u v5.8.7</title>
  <link rel="manifest" href="manifest.json?v=5.8.7">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --txt: #f8fafc;
      --txt-sub: #94a3b8;
      --accent: #3b82f6;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --line: #e2e8f0;
      --txt: #0f172a;
      --txt-sub: #64748b;
      --accent: #2563eb;
    }
    body {
      background-color: var(--bg);
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .btn {
      background-color: var(--accent);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-sub {
      background-color: var(--line);
      color: var(--txt);
    }
    .input-box {
      width: 100%;
      background-color: var(--bg);
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .msg-box {
      max-height: 50vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px;
    }
    .msg {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      max-width: 85%;
      word-break: break-word;
    }
    .msg-user {
      align-self: flex-end;
      background-color: #2563eb;
      color: white;
    }
    .msg-ai {
      align-self: flex-start;
      background-color: var(--line);
      color: var(--txt);
    }
    .msg-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--txt-sub);
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="flex justify-between items-center mb-3">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold">Builder-a4u</h1>
      <span class="text-xs px-2 py-0.5 rounded bg-blue-600 text-white font-mono">v5.8.7</span>
    </div>
    <div class="flex gap-2 items-center">
      <button id="themeToggle" class="w-9 h-9 rounded-full bg-slate-700 text-white flex items-center justify-center">🌙</button>
      <button id="navSettings" class="btn btn-sub text-xs">⚙️ 설정</button>
    </div>
  </div>

  <!-- 프로젝트 선택 -->
  <div class="card">
    <div class="text-xs text-slate-400 mb-1">프로젝트 레포 선택</div>
    <div class="flex gap-2">
      <select id="repoSelect" class="input-box text-sm">
        <option value="builder-a4u">apoco211/builder-a4u</option>
      </select>
      <button id="repoRefreshBtn" class="btn btn-sub text-xs whitespace-nowrap">🔄</button>
    </div>
  </div>

  <!-- 3탭 AI 채팅 메인 -->
  <div id="workspaceView" class="card">
    <!-- 3탭 버튼 -->
    <div class="flex gap-2 mb-3">
      <button id="tabMeta" class="tab-btn active" onclick="switchTab('meta')">🟣 Meta (Groq)</button>
      <button id="tabGemini" class="tab-btn" onclick="switchTab('gemini')">🔵 Gemini</button>
      <button id="tabGpt" class="tab-btn" onclick="switchTab('gpt')">🟢 GPT</button>
    </div>

    <!-- 주입된 맥락 표시 -->
    <div id="contextPromptBox" class="bg-amber-950/40 border border-amber-700/50 p-2.5 rounded-lg text-xs text-amber-200 mb-3">
      <div class="font-bold mb-1">[자동주입 맥락] <span id="currentRepoLabel">builder-a4u</span></div>
      <div id="contextPromptText" class="whitespace-pre-line text-[11px] opacity-90">1.프로젝트: builder-a4u v5.8.7
2.목적: 단일 공방으로 N개 앱 맥락 유지
3.현재: Groq 모델 퇴출 대응 (gpt-oss-20b/120b 전환 완료)</div>
    </div>

    <!-- 채팅 내역 -->
    <div id="chatBox" class="msg-box mb-3">
      <div class="msg msg-ai">안녕하세요! Builder-a4u v5.8.7 공방입니다. Groq API 모델이 최신 `openai/gpt-oss-20b` 및 `120b`로 업데이트되었습니다. 대화를 시작해보세요.</div>
    </div>

    <!-- 캡처 이미지 미리보기 -->
    <div id="imagePreview" class="hidden relative mb-2">
      <img id="previewImg" class="max-h-32 rounded border border-slate-600" />
      <button id="removePreview" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">✕</button>
    </div>

    <!-- 채팅 입력 -->
    <div class="flex gap-2">
      <input type="text" id="chatInput" class="input-box" placeholder="메시지 입력 또는 Ctrl+V 캡처 이미지 붙여넣기..." onkeypress="if(event.key==='Enter') sendChat()">
      <button onclick="sendChat()" class="btn whitespace-nowrap">전송</button>
    </div>
  </div>

  <!-- 설정 모달/뷰 -->
  <div id="settingsView" class="card hidden">
    <h2 class="text-md font-bold mb-3">⚙️ 공방 API & 기억 설정</h2>
    
    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">Groq API Key (Meta 탭)</label>
      <input type="password" id="groqKeyInput" class="input-box text-xs" placeholder="gsk_...">
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">Groq 선택 모델</label>
      <select id="groqModelInput" class="input-box text-xs">
        <option value="auto">🤖 자동 (gpt-oss-20b -> 120b -> qwen3.8)</option>
        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (초고속, 추천)</option>
        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (고성능 GPT-4급)</option>
        <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b (오픈소스 코딩 특화)</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">Gemini API Key</label>
      <input type="password" id="geminiKeyInput" class="input-box text-xs" placeholder="AIzaSy...">
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">GitHub PAT</label>
      <input type="password" id="githubPatInput" class="input-box text-xs" placeholder="ghp_...">
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">기억 10줄 (Memory 10)</label>
      <textarea id="memory10" class="input-box text-xs h-28 font-mono"></textarea>
    </div>

    <div class="mb-3">
      <label class="text-xs text-slate-400 block mb-1">📋 전체 맥락 복사 (v5.8.7 구글 문서 링크 자동 합성)</label>
      <textarea id="contextCopyBox" readonly class="input-box text-xs h-32 font-mono bg-slate-900 text-slate-300"></textarea>
      <button id="copyContextBtn" onclick="copyContext()" class="btn text-xs mt-2 w-full">📋 전체 맥락 복사</button>
    </div>

    <button onclick="toggleSettings()" class="btn btn-sub text-xs w-full">닫기</button>
  </div>

  <script>
    let currentTab = 'meta';
    let currentRepo = 'builder-a4u';
    let pastedImageData = null;

    // v5.8.7 업데이트된 Groq 활성 모델 목록 (퇴출된 llama-3.3-70b-versatile 완전히 제거)
    const VALID_GROQ_MODELS = [
      'openai/gpt-oss-20b',
      'openai/gpt-oss-120b',
      'qwen/qwen3.8-27b'
    ];

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      buildContextCopyV87();
      
      document.getElementById('navSettings').addEventListener('click', toggleSettings);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      
      // Ctrl+V 이미지 캡처 붙여넣기
      document.addEventListener('paste', handlePaste);
      document.getElementById('removePreview').addEventListener('click', () => {
        pastedImageData = null;
        document.getElementById('imagePreview').classList.add('hidden');
      });

      document.getElementById('memory10').addEventListener('input', buildContextCopyV87);
    });

    function toggleSettings() {
      document.getElementById('workspaceView').classList.toggle('hidden');
      document.getElementById('settingsView').classList.toggle('hidden');
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    function switchTab(tab) {
      currentTab = tab;
      ['tabMeta', 'tabGemini', 'tabGpt'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      if (tab === 'meta') document.getElementById('tabMeta').classList.add('active');
      if (tab === 'gemini') document.getElementById('tabGemini').classList.add('active');
      if (tab === 'gpt') document.getElementById('tabGpt').classList.add('active');
    }

    function loadSettings() {
      document.getElementById('groqKeyInput').value = localStorage.getItem('groq_key') || '';
      document.getElementById('groqModelInput').value = localStorage.getItem('groq_model') || 'auto';
      document.getElementById('geminiKeyInput').value = localStorage.getItem('gemini_key') || '';
      document.getElementById('githubPatInput').value = localStorage.getItem('github_pat') || '';
      
      const savedMem = localStorage.getItem(`memory10_${currentRepo}`) || 
`1.프로젝트: builder-a4u v5.8.7
2.목적: 단일 공방으로 N개 앱 맥락 유지
3.현재: 2026. 10. 6. - Groq API 모델 퇴출 대응 (gpt-oss-20b 적용)
4.다음: 기능 구현 및 빌드 배포
5.결정: Groq 유효 모델 auto/gpt-oss-20b/120b 설정
6.제외: 퇴출된 llama-3.3-70b-versatile
7.저장: Supabase+Docs+GitHub+localStorage
8.버그: Groq 모델 퇴출로 인한 404 오류 해결
9.모드: 빌드모드
10.상태: 진행중`;

      document.getElementById('memory10').value = savedMem;
    }

    // v5.8.7 구글 문서 링크 자동 합성
    function buildContextCopyV87() {
      const repo = currentRepo;
      const memText = document.getElementById('memory10').value || '';
      const mainDocUrl = localStorage.getItem('mainDocUrl') || 'https://docs.google.com/document/d/1nV-tv5c98U2ho0QX4R59LRYF7h5BPZOPV1J6oH_mOQQ/edit';
      const customLinks = JSON.parse(localStorage.getItem(`customLinks_${repo}`) || '[]');

      let docSection = '[구글 문서 링크]\n';
      docSection += `- 메인문서: ${mainDocUrl} ([아이디어] 개발 공방 Builder - 단일 공방으로 N개 앱 맥락 유지 구조 v1.0)\n`;
      if (customLinks.length > 0) {
        customLinks.forEach((l, i) => {
          docSection += `- 추가문서${i+1}: ${l.url} (${l.title || '문서'})\n`;
        });
      } else {
        docSection += `- 추가문서: 없음\n`;
      }

      const fullContext = `${memText.trim()}\n\n${docSection}\n[프로젝트 링크]\n1. repo: https://github.com/apoco211/${repo}\n2. pages: https://apoco211.github.io/${repo}/?v=5.8.7`;
      
      document.getElementById('contextCopyBox').value = fullContext;
      return fullContext;
    }

    function copyContext() {
      const text = document.getElementById('contextCopyBox').value;
      navigator.clipboard.writeText(text).then(() => {
        alert('전체 맥락이 클립보드에 복사되었습니다!');
      });
    }

    function handlePaste(e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            pastedImageData = event.target.result;
            document.getElementById('previewImg').src = pastedImageData;
            document.getElementById('imagePreview').classList.remove('hidden');
          };
          reader.readAsDataURL(blob);
        }
      }
    }

    // Groq API 호출 (v5.8.7 핵심 수정: 퇴출된 llama-3.3-70b-versatile 차단 및 gpt-oss 자동 순회)
    async function callGroqAPI(prompt, apiKey, modelSetting) {
      let modelsToTry = [];
      if (modelSetting && modelSetting !== 'auto' && VALID_GROQ_MODELS.includes(modelSetting)) {
        modelsToTry = [modelSetting];
      } else {
        modelsToTry = VALID_GROQ_MODELS; // ['openai/gpt-oss-20b', 'openai/gpt-oss-120b', 'qwen/qwen3.8-27b']
      }

      let lastError = null;
      for (const model of modelsToTry) {
        try {
          console.log(`Groq API 시도 중: ${model}`);
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: model,
              messages: [
                { role: 'system', content: '당신은 Builder-a4u 공방 AI 비서입니다. 코드를 요구받기 전까지는 기획 모드로 대화하세요.' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.7
            })
          });

          const data = await res.json();
          if (res.ok && data.choices && data.choices[0]) {
            return { success: true, text: data.choices[0].message.content, modelUsed: model };
          } else {
            lastError = data.error ? data.error.message : 'Groq API 응답 에러';
            console.warn(`Groq 모델 ${model} 실패:`, lastError);
          }
        } catch (err) {
          lastError = err.message;
        }
      }
      return { success: false, error: lastError || '모든 Groq 유효 모델 시도 실패' };
    }

    // 채팅 전송
    async function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text && !pastedImageData) return;

      const chatBox = document.getElementById('chatBox');
      
      // 사용자 메시지 추가
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'msg msg-user';
      if (pastedImageData) {
        userMsgDiv.innerHTML = `<img src="${pastedImageData}" class="max-h-32 rounded mb-1 border" /><br>${text}`;
      } else {
        userMsgDiv.textContent = text;
      }
      chatBox.appendChild(userMsgDiv);
      
      input.value = '';
      const currentImage = pastedImageData;
      pastedImageData = null;
      document.getElementById('imagePreview').classList.add('hidden');

      // AI 대기 메시지
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'msg msg-ai';
      aiMsgDiv.textContent = '생각 중...';
      chatBox.appendChild(aiMsgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const groqKey = document.getElementById('groqKeyInput').value || localStorage.getItem('groq_key');
      const groqModel = document.getElementById('groqModelInput').value || localStorage.getItem('groq_model');

      if (currentTab === 'meta') {
        if (!groqKey) {
          aiMsgDiv.className = 'msg msg-error';
          aiMsgDiv.textContent = '⚠️ Groq API 키가 설정되지 않았습니다. 설정(⚙️) 메뉴에서 API 키를 입력해주세요.';
          return;
        }

        const context = document.getElementById('contextPromptText').textContent;
        const fullPrompt = `[맥락]\n${context}\n\n[사용자 메시지]\n${text}`;

        const result = await callGroqAPI(fullPrompt, groqKey, groqModel);
        if (result.success) {
          aiMsgDiv.innerHTML = `<strong>[Meta - ${result.modelUsed}]</strong><br>${result.text.replace(/\n/g, '<br>')}`;
        } else {
          aiMsgDiv.className = 'msg msg-error';
          aiMsgDiv.textContent = `⚠️ 오류 발생: ${result.error}`;
        }
      } else {
        setTimeout(() => {
          aiMsgDiv.textContent = `[${currentTab.toUpperCase()}] 탭 응답 준비 완료 (Gemini/GPT 키 확인 필요)`;
        }, 800);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
