<style>
/* 기존 : :root{--bg:#f8fafc; … }   (그대로 두고 아래만 추가) */

/* 1) 뷰포트 기반 폰트 사이즈 (clamp 로 최소‑최대값 지정) */
html{
  /* 14 px ~ 18 px 사이를 화면 너비에 따라 가변 */
  font-size: clamp(14px, 1vw + 0.5rem, 18px);
}

/* 2) 기존 색·다크모드 변수는 그대로 유지 */
:root{--bg:#f8fafc;--card:#ffffff;--line:#e2e8f0;--txt:#0f172a;--muted:#64748b;--accent:#FFC800;--meta:#7c3aed;--gemini:#0ea5e9;--gpt:#10b981}
.dark{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#e2e8f0;--muted:#94a3b8}

/* 3) 기본 레이아웃·폭을 크게 잡아 PC에서 너무 좁게 보이는 현상 방지 */
body{
  max-width: 960px;               /* 기존 900 → 960 (조금 넓게) */
  padding: 20px 24px 120px 24px;   /* 기존 14 → 20 (PC) */
}

/* 4) 카드·버튼·입력창 등 UI 요소에 반응형 폰트·패딩 적용 */
.card{padding:1.125rem; font-size:0.95rem;}      /* 18 → 1.125rem, 글자 약간 커짐 */
.btn{padding:0.5rem 0.75rem; font-size:0.85rem;} /* 기존 8‑12px → rem 로 변환 */
.input,.textarea{font-size:0.85rem;}

/* 5) 큰 화면(≥1024px)에서는 더 넉넉하게 */
@media (min-width:1024px){
  body{max-width:1080px; padding:24px 32px 140px 32px;}
  .card{padding:1.5rem;}
  .btn{padding:0.75rem 1rem;}
  .chat-box{height:560px;}   /* 기존 480 → 560 */
}

/* 6) 중간 화면(760‑1023px)에서도 충분히 보이게 */
@media (min-width:760px) and (max-width:1023px){
  body{max-width:860px;}
}

/* 7) 텍스트·버튼에 Tailwind responsive 클래스도 병행 가능 */
</style>
