<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Builder-a4u v5.3.18 - 주야간 아이콘 토글 + 실전 빌드 개선 - Groq+Gemini 404 모두 수정 + PC 반응형</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<link rel="manifest" href="./manifest.json?v=5.3.18">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>
/* ---------- 1. 폰트 및 기본 변수 ---------- */
@font-face{
  font-family:"Optimistic";font-style:normal;font-weight:400 600;font-display:swap;
  src:url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2")
}
@font-face{
  font-family:"Optimistic Mono";font-style:normal;font-weight:400;font-display:swap;
  src:url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2")
}
:where(html){font-family:"Optimistic",system-ui,sans-serif}
:where(code,pre,kbd,samp){font-family:"Optimistic Mono",ui-monospace,monospace}

/* ---------- 2. 색상 변수 ---------- */
:root{
  --bg:#f8fafc;--card:#ffffff;--line:#e2e8f0;--txt:#0f172a;--muted:#64748b;
  --accent:#FFC800;--meta:#7c3aed;--gemini:#0ea5e9;--gpt:#10b981
}
.dark{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#e2e8f0;--muted:#94a3b8}

/* ---------- 3. 공통 스타일 ---------- */
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);max-width:900px;margin:0 auto;
  padding:14px 14px 100px 14px;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  transition:.2s;font-size:15px;line-height:1.5
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:.2s}
.btn{border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);min-height:40px}
.btn-primary{background:#111 !important;color:#fff !important;border-color:#111 !important}
.btn-yellow{background:var(--accent) !important;color:#111 !important;border-color:var(--accent) !important;font-weight:900}
.btn-meta{background:var(--meta) !important;color:#fff !important;border-color:var(--meta) !important}
.btn-gemini{background:var(--gemini) !important;color:#fff !important;border-color:var(--gemini) !important}
.btn-gpt{background:var(--gpt) !important;color:#fff !important;border-color:var(--gpt) !important}
.btn-sm{padding:8px 12px;font-size:12px;min-height:34px}
.btn:active{transform:scale(.97)}
.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--txt);font-size:16px;outline:none;min-height:46px}
.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--txt);font-size:14px;line-height:1.6;outline:none;resize:vertical}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line)}
.log{font-family:monospace;font-size:12px;line-height:1.6;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.chat-box{border:1px solid var(--line);border-radius:14px;background:var(--bg);height:420px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg-user{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:6px}
.msg-ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg-system{align-self:center;background:#fffbeb;border:1px dashed #f59e0b;font-size:12px;max-width:95%;padding:10px 12px}
.dark .msg-system{background:#2a2410 !important;color:#fef3c7 !important}
.dark .btn{background:#252a36 !important;color:#e2e8f0 !important;border-color:#3a4152 !important}
.dark .btn-primary{background:#e2e8f0 !important;color:#0f1115 !important;border-color:#e2e8f0 !important}
.dark .btn-yellow{background:#FFC800 !important;color:#111 !important;border-color:#FFC800 !important}
.dark .input{background:#1e222e !important;color:#e2e8f0 !important;border-color:#3a4152 !important}
.dark .input::placeholder{color:#94a3b8 !important;opacity:0.8}
.dark .textarea{background:#1e222e !important;color:#e2e8f0 !important;border-color:#3a4152 !important}
.dark .card{border-color:#2a2f3a !important}
.dark .chat-box{background:#0f1115 !important;border-color:#2a2f3a !important}
.dark .msg-ai{background:#1a1d24 !important;color:#e2e8f0 !important;border-color:#2a2f3a !important}
.dark .log{background:#0f1115 !important;color:#cbd5e1 !important;border-color:#2a2f3a !important}
.dark button[style*="background:#fff"], .dark button[style*="background: #fff"], .dark #saveDraftBtn{background:#252a36 !important;color:#e2e8f0 !important;border:2px solid #3a4152 !important}
.dark #saveDraftBtn span, .dark #saveDraftBtn{color:#e2e8f0 !important}
.dark .top-tab{background:#1a1d24 !important;color:#e2e8f0 !important;border-color:#2a2f3a !important}
.dark #chatInput{background:#1e222e !important;color:#e2e8f0 !important}
.top-tab{flex:1;padding:14px 10px;border-radius:14px;font-weight:900;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--txt);min-height:48px}
.top-tab.active{background:#111 !important;color:#fff !important;border-color:#111 !important;box-shadow:0 0 0 2px var(--accent)}
.tab-active{border:2px solid #111 !important;box-shadow:0 0 0 2px var(--accent)}
.link-item{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.view-hidden{display:none !important}

/* ---------- 4. 다크 모드 - 중간 노란 박스, 기억10줄 ---------- */
.dark #contextBox{background:#1e222e !important;border-color:#3a4152 !important;color:#e2e8f0 !important}
.dark #contextText{color:#e2e8f0 !important}
.dark #contextBox #contextText{color:#cbd5e1 !important}
.dark textarea#memory10{background:#1e222e !important;color:#e2e8f0 !important;border-color:#3a4152 !important}
.dark textarea#memory10::placeholder{color:#94a3b8 !important}
.dark div[style*="background:#fffbeb"], .dark div[style*="background: #fffbeb"]{background:#1e222e !important;border-color:#3a4152 !important;color:#e2e8f0 !important}
.dark #contextBox[style*="fffbeb"]{background:#252a36 !important;color:#e2e8f0 !important}
.dark #contextBox a{color:#60a5fa !important}
.dark .p-2.rounded-[12px].bg-[#fffbeb]{background:#1e222e !important;color:#e2e8f0 !important;border-color:#3a4152 !important}
.dark span.text-[8px]{color:#94a3b8 !important;opacity:1 !important}
.dark .text-[9px]{color:#94a3b8 !important}

/* ---------- 5. 반응형 ---------- */
@media (max-width:768px){
  body{padding:10px 10px 100px 10px;font-size:14px}
  .card{padding:12px;border-radius:14px}
  .top-tab{font-size:13px;padding:10px 6px;min-height:42px}
  .btn{font-size:12.5px;padding:10px 12px;min-height:40px}
  .btn-sm{font-size:11.5px;padding:8px 10px;min-height:34px}
  .input{font-size:15px !important;padding:12px;min-height:44px}
  .textarea{font-size:13.5px !important}
  .chat-box{height:48vh;min-height:360px}
  .msg{font-size:13.5px !important;line-height:1.5;padding:10px 12px}
  .msg-system{font-size:11.5px}
  .msg-user,.msg-ai{font-size:13.5px !important}
  h1{font-size:17px !important}
  h2{font-size:12.5px !important}
  .log{font-size:10.5px}
  .badge{font-size:9px}
  .doc-card{font-size:12px}
}
@media (min-width:1024px){
  body{max-width:980px;padding:24px 28px 120px 28px;font-size:15px}
  .chat-box{height:520px}
  .card{padding:20px}
  .msg{font-size:13.5px}
  .input{font-size:15px}
  .textarea{font-size:14px}
  h1{font-size:22px !important}
}
@media (min-width:760px) and (max-width:1023px){
  body{max-width:860px;font-size:15px}
}
</style>
</head>

<body>
  <!-- 헤더 + 테마 토글 -->
  <div class="flex justify-between items-center mb-3">
    <div>
      <h1 class="text-[18px] font-black">Builder-a4u v5.3.18</h1>
      <p class="text-[10px] opacity-60">PWA 최적화 + 주야간 아이콘 토글 + 실전 빌드 + draft 분리</p>
    </div>
    <div class="flex gap-2 items-center">
      <button id="themeToggle" class="btn w-[40px] h-[40px] p-0 flex items-center justify-center text-[18px] rounded-full" title="주야간 전환">🌙</button>
      <span class="badge" style="background:#111;color:#fff">v5.3.18</span>
    </div>
  </div>

  <!-- 상단 탭 -->
  <div class="flex gap-2 mb-3">
    <button id="topTabWorkspace" class="top-tab active">🛠️ 작업</button>
    <button id="topTabSettings" class="top-tab">⚙️ 설정</button>
  </div>

  <!-- 작업 뷰 -->
  <div id="workspaceView">
    <!-- 프로젝트 선택 카드 -->
    <div class="card">
      <h2 class="font-bold text-[11px] mb-2">프로젝트 선택 <span id="draftStatus" class="text-[9px] opacity-60 ml-2">draft 대기</span></h2>
      <select id="repoSelect" class="input mb-2 text-[12px]"><option>레포 로딩중...</option></select>
      <div class="flex gap-1 mt-1">
        <input id="mainFileInput" class="input text-[10px] flex-1" placeholder="mainFile 자동">
        <button id="fetchMainBtn" class="btn text-[9px] whitespace-nowrap" title="GitHub raw에서 진짜 코드 다시 불러오기">📥 GitHub 복구</button>
        <button id="forceDraftResetBtn" class="btn text-[9px] whitespace-nowrap" title="로컬 draft 비우고 GitHub 최신으로 강제 복구">🔄 강제 복구</button>
      </div>
      <textarea id="codeEditor" class="textarea h-[80px] mt-2 hidden"></textarea>
      <div class="flex justify-end mt-1"><button id="toggleDraftBtn" class="btn text-[8px]">draft 보기 ▼</button></div>
    </div>

    <!-- 메인 문서 카드 -->
    <div class="card">
      <h2 class="font-bold text-[11px] mb-2">📄 메인 문서 - 계속 업데이트 1개 (체크박스)</h2>
      <div class="flex gap-2 mb-2">
        <input id="docSearchInput" class="input text-[12px]" placeholder="제목 검색">
        <button id="searchExactBtn" class="btn text-[10px]">🔍 Drive에서 찾기</button>
      </div>
      <div id="driveResultsBox" class="border rounded-[12px] p-2 max-h-[240px] overflow-auto"></div>
    </div>
  </div>

  <!-- 설정 뷰 (숨김) -->
  <div id="settingsView" class="hidden">
    <div class="card">
      <h2 class="font-bold text-[11px] mb-2">⚙️ 설정 (API, 인증 등)</h2>
      <!-- API 키 입력란은 비활성화 -->
      <input id="apiKeyInput" class="input mb-2 text-[12px]" placeholder="API 키" disabled>
      <p class="text-[12px] text-muted mb-2">API 키는 설정 탭에서만 보이도록 비활성화되었습니다.</p>
      <!-- Draft B 숨김 -->
      <div id="draftB" class="view-hidden">
        <p>Draft B 내용 (숨김)</p>
      </div>
    </div>
  </div>

  <!-- 스크립트 -->
  <script>
    // 테마 토글
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;
    themeToggle.addEventListener('click', () => {
      htmlEl.classList.toggle('dark');
      themeToggle.textContent = htmlEl.classList.contains('dark') ? '☀️' : '🌙';
    });

    // 탭 전환
    const topTabWorkspace = document.getElementById('topTabWorkspace');
    const topTabSettings = document.getElementById('topTabSettings');
    const workspaceView = document.getElementById('workspaceView');
    const settingsView = document.getElementById('settingsView');
    topTabWorkspace.addEventListener('click', () => {
      topTabWorkspace.classList.add('active');
      topTabSettings.classList.remove('active');
      workspaceView.classList.remove('hidden');
      settingsView.classList.add('hidden');
    });
    topTabSettings.addEventListener('click', () => {
      topTabSettings.classList.add('active');
      topTabWorkspace.classList.remove('active');
      settingsView.classList.remove('hidden');
      workspaceView.classList.add('hidden');
    });

    // Draft 토글
    const toggleDraftBtn = document.getElementById('toggleDraftBtn');
    const codeEditor = document.getElementById('codeEditor');
    toggleDraftBtn.addEventListener('click', () => {
      codeEditor.classList.toggle('hidden');
      toggleDraftBtn.textContent = codeEditor.classList.contains('hidden') ? 'draft 보기 ▼' : 'draft 숨기기 ▲';
    });

    // GitHub 복구 (샘플 로직)
    document.getElementById('fetchMainBtn').addEventListener('click', () => {
      const repo = document.getElementById('repoSelect').value;
      const mainFile = document.getElementById('mainFileInput').value || 'main.py';
      fetch(`https://raw.githubusercontent.com/${repo}/main/${mainFile}`)
        .then(r => r.text())
        .then(text => { codeEditor.value = text; codeEditor.classList.remove('hidden'); })
        .catch(err => alert('GitHub 복구 실패: ' + err));
    });

    // 강제 복구 (샘플 로직)
    document.getElementById('forceDraftResetBtn').addEventListener('click', () => {
      localStorage.removeItem('draft');
      alert('로컬 draft 삭제 후 최신 GitHub 코드 로드 중...');
      // 재로드 로직 추가 가능
    });
  </script>

  <!-- Service Worker 등록 (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js?v=5.3.18')
          .then(reg => console.log('ServiceWorker 등록 완료:', reg.scope))
          .catch(err => console.error('ServiceWorker 등록 실패:', err));
      });
    }
  </script>
</body>
</html>
