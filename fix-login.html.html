<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>builder-a4u - Drive 로그인 수정</title>
<script src="https://accounts.google.com/gsi/client"><\/script>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0a0a0b;color:#ececec;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:520px;background:#151517;border:1px solid #232326;border-radius:20px;padding:28px}
  .btn{width:100%;background:#fff;color:#000;border-radius:12px;padding:14px 16px;font-weight:700;border:0;cursor:pointer}
  .muted{color:#9a9aa0;font-size:13px;line-height:1.5}
  input{width:100%;background:#0e0e10;border:1px solid #2a2a2e;border-radius:10px;color:#fff;padding:12px 12px;margin:10px 0 16px}
</style>
</head>
<body>
<div class="card">
  <h1 style="margin:0 0 6px;font-size:20px">Drive 권한으로만 로그인 (에러 해결 버전)</h1>
  <p class="muted">이 페이지는 https://apoco211.github.io 에서만 동작합니다.</p>
  <input id="cid" value="${e}" />
  <button class="btn" id="login">Drive 권한으로만 로그인 (에러 해결 버전)</button>
  <pre id="out" class="muted" style="margin-top:16px;white-space:pre-wrap;word-break:break-all"></pre>
  <script>
    const $ = (s) => document.querySelector(s);
    let tokenClient;
    $("#login").onclick = () => {
      const clientId = $("#cid").value.trim();
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          const token = resp.access_token;
          localStorage.setItem('builder_a4u_access_token', token);
          localStorage.setItem('access_token', token);
          localStorage.setItem('gdrive_token', token);
          sessionStorage.setItem('builder_a4u_access_token', token);
          $("#out").textContent = '성공! 토큰: ' + token.slice(0,32) + '... \\n\\n이제 /builder-a4u/ 로 이동하면 됩니다.';
        }
      });
      tokenClient.requestAccessToken();
    };
  <\/script>
